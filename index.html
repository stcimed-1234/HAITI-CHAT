  <script>

    const btn = document.getElementById('btn');
    const settingsPanel = document.getElementById('settingsPanel');
    btn.addEventListener('click', (event) => {
      event.stopPropagation();
      const isOpen = !settingsPanel.classList.contains('hidden');
      settingsPanel.classList.toggle('hidden', isOpen);
      btn.setAttribute('aria-expanded', String(!isOpen));
    });
    document.addEventListener('click', (event) => {
      if (!settingsPanel.contains(event.target) && !btn.contains(event.target)) {
        btn.setAttribute('aria-expanded', 'false');
        settingsPanel.classList.add('hidden');
      }
    });
  </script>

    const menuHtn = document.getElementById('app-menu-htn');
    const menuAppGoogle = document.getElementById('appMenuGoogle');
  
    // Ouvrir/Fermer au clic sur le bouton
    menuHtn.addEventListener('click', (event) => {

      menuAppGoogle.classList.toggle('hidden');

    // Fermer le menu si l'on clique en dehors
    document.addEventListener('click', (event) => {

        menuAppGoogle.classList.add('hidden');
      }
    });

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const accountButton = document.getElementById('accountButton');
    const accountDialog = document.getElementById('accountDialog');
    const accountForm = document.getElementById('accountForm');
    const accountTitle = document.getElementById('accountTitle');
    const accountStatus = document.getElementById('accountStatus');
    const accountSubmit = document.getElementById('accountSubmit');
    const accountModeToggle = document.getElementById('accountModeToggle');
    const accountPassword = document.getElementById('accountPassword');
    const signedInPanel = document.getElementById('signedInPanel');
    const signedInEmail = document.getElementById('signedInEmail');
    const signOutButton = document.getElementById('signOutButton');
    let authClient;
    let authInitializationError = 'Sèvis kont yo ap prepare.';
    let authMode = 'signup';

    function setAccountMode(mode) {
      authMode = mode;
      const isSignup = mode === 'signup';
      accountTitle.textContent = isSignup ? 'Kreye kont' : 'Konekte';
      accountSubmit.textContent = isSignup ? 'Kreye kont' : 'Konekte';
      accountPassword.autocomplete = isSignup ? 'new-password' : 'current-password';
      accountModeToggle.textContent = isSignup
        ? 'Ou deja gen kont? Konekte'
        : 'Ou poko gen kont? Kreye youn';
      accountStatus.textContent = '';
    }

    function showAccount(user) {
      const isSignedIn = Boolean(user);
      accountForm.hidden = isSignedIn;
      signedInPanel.hidden = !isSignedIn;
      accountModeToggle.hidden = isSignedIn;
      if (user) {
        signedInEmail.textContent = user.email || '';
        accountStatus.textContent = 'Ou konekte sou kont ou.';
      } else {
        setAccountMode(authMode);
      }
    }

    accountButton.addEventListener('click', () => {
      if (!accountDialog.open) accountDialog.showModal();
      if (!authClient) accountStatus.textContent = authInitializationError;
    });

    document.getElementById('closeAccountDialog').addEventListener('click', () => {
      accountDialog.close();
    });

    accountDialog.addEventListener('click', (event) => {
      if (event.target === accountDialog) accountDialog.close();
    });

    accountModeToggle.addEventListener('click', () => {
      setAccountMode(authMode === 'signup' ? 'login' : 'signup');
    });

    accountForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!authClient) {
        accountStatus.textContent = authInitializationError;
        return;
      }

      accountSubmit.disabled = true;
      accountStatus.textContent = 'Tanpri tann...';
      const email = document.getElementById('accountEmail').value.trim();
      const password = accountPassword.value;
      try {
        const result = authMode === 'signup'
          ? await authClient.auth.signUp({ email, password })
          : await authClient.auth.signInWithPassword({ email, password });

        if (result.error) {
          accountStatus.textContent = result.error.message;
        } else if (authMode === 'signup' && !result.data.session) {
          accountStatus.textContent = 'Verifye imèl ou pou aktive kont lan.';
          accountForm.reset();
        } else {
          accountStatus.textContent = 'Koneksyon an reyisi.';
        }
      } catch (error) {
        accountStatus.textContent = error.message || 'Pa t kapab konekte. Eseye ankò.';
      } finally {
        accountSubmit.disabled = false;
      }
    });

    signOutButton.addEventListener('click', async () => {
      const { error } = await authClient.auth.signOut();
      accountStatus.textContent = error ? error.message : 'Ou dekonekte.';
      if (!error) {
        accountForm.reset();
        setAccountMode('login');
      }
    });

    async function initializeAccounts() {
      try {
        const response = await fetch('/auth-config', { headers: { Accept: 'application/json' } });
        const config = await response.json();
        if (!response.ok) throw new Error(config.error || 'Konfigirasyon kont yo pa disponib.');
        if (!window.supabase?.createClient) {
          throw new Error('Sèvis koneksyon an pa t ka chaje. Verifye koneksyon entènèt la.');
        }
        authClient = window.supabase.createClient(config.url, config.publishableKey);
        authInitializationError = '';
        authClient.auth.onAuthStateChange((_event, session) => showAccount(session?.user || null));
        const { data, error } = await authClient.auth.getSession();
        if (error) throw error;
        showAccount(data.session?.user || null);
      } catch (error) {
        authInitializationError = error.message;
        accountStatus.textContent = authInitializationError;
      }
    }

    initializeAccounts();
  </script>
  <script>
  const searchForm = document.getElementById('searchForm');
  const searchInput = document.getElementById('query');
  const searchResults = document.getElementById('results');
  const searchCategories = document.getElementById('searchCategories');
  const mapsCategory = document.getElementById('mapsCategory');
  const searchLanguage = document.getElementById('searchLanguage');
  const resultLimit = document.getElementById('resultLimit');
  const themeSelect = document.getElementById('themeSelect');
  const settingsStorageKey = 'haitichat-settings';
  const defaultSettings = { language: 'fr', limit: '100', theme: 'light' };
  let settings = { ...defaultSettings };
  let activeCategory = 'all';
  let activeSearchController;

  try {
    const savedSettings = JSON.parse(localStorage.getItem(settingsStorageKey) || '{}');
    if (['fr', 'ht'].includes(savedSettings.language)) settings.language = savedSettings.language;
    if (['20', '50', '100', '200', '500', '1000'].includes(savedSettings.limit)) settings.limit = savedSettings.limit;
    if (['light', 'dark'].includes(savedSettings.theme)) settings.theme = savedSettings.theme;
  } catch (error) {
    console.warn('Impossible de charger les paramètres enregistrés.', error);
  }

  searchLanguage.value = settings.language;
  resultLimit.value = settings.limit;
  themeSelect.value = settings.theme;
  document.body.dataset.theme = settings.theme;

  function saveSettings() {
    try {
      localStorage.setItem(settingsStorageKey, JSON.stringify(settings));
    } catch (error) {
      console.warn('Impossible d’enregistrer les paramètres.', error);
    }
  }

  function updateSettings() {
    settings.language = searchLanguage.value;
    settings.limit = resultLimit.value;
    settings.theme = themeSelect.value;
    document.body.dataset.theme = settings.theme;
    saveSettings();
    const query = searchInput.value.trim();
    if (query) runSearch(query, activeCategory);
  }

  searchLanguage.addEventListener('change', updateSettings);
  resultLimit.addEventListener('change', updateSettings);
  themeSelect.addEventListener('change', updateSettings);

  function createSiteSource(url) {
    const source = document.createElement('a');
    const logo = document.createElement('img');
    const siteName = document.createElement('span');
    const siteUrl = new URL(url);

    source.className = 'result-source';
    source.href = siteUrl.origin;
    source.target = '_blank';
    source.rel = 'noopener noreferrer';
    logo.src = `https://www.google.com/s2/favicons?domain_url=${encodeURIComponent(siteUrl.origin)}&sz=64`;
    logo.alt = '';
    logo.loading = 'lazy';
    logo.referrerPolicy = 'no-referrer';
    logo.addEventListener('error', () => logo.remove(), { once: true });
    siteName.textContent = siteUrl.hostname.replace(/^www\./, '');
    source.append(logo, siteName);
    return source;
  }

  async function runSearch(query, category) {
    activeSearchController?.abort();
    activeSearchController = new AbortController();
    document.querySelector('.search-home').classList.add('result-mode');
    searchCategories.hidden = false;
    for (const button of searchCategories.querySelectorAll('[data-category]')) {
      button.setAttribute('aria-pressed', String(button.dataset.category === category));
    }
    mapsCategory.href = `https://www.google.com/maps/search/${encodeURIComponent(`${query} Haïti`)}`;
    searchResults.replaceChildren();
    searchResults.classList.toggle('image-results', category === 'images');
    const loadingMessage = document.createElement('p');
    loadingMessage.className = 'results-state';
    loadingMessage.textContent = category === 'images' ? 'Ap chèche imaj...' : 'Ap chèche...';
    searchResults.append(loadingMessage);

    try {
      const response = await fetch(
        `/search?query=${encodeURIComponent(query)}&category=${encodeURIComponent(category)}&language=${encodeURIComponent(settings.language)}&limit=${encodeURIComponent(settings.limit)}`,
        {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          },
          signal: activeSearchController.signal
        }
      );
      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || 'La recherche a échoué.');
      }

      searchResults.replaceChildren();
      const summary = document.createElement('p');
      summary.className = 'results-summary';
      const categoryNames = {
        all: 'Tout',
        images: 'Imaj',
        videos: 'Videyo',
        news: 'Nouvèl',
        books: 'Liv'
      };
      summary.textContent = `${categoryNames[category]} pou : ${query}`;
      searchResults.append(summary);

      if (data.length === 0) {
        const emptyMessage = document.createElement('p');
        emptyMessage.className = 'results-state';
        emptyMessage.textContent = category === 'videos'
          ? 'Pa jwenn videyo dirèk pou rechèch sa a. '
          : 'Pa gen rezilta pou kategori sa a. Eseye yon lòt rechèch.';
        searchResults.append(emptyMessage);
        if (category === 'videos') {
          const youtubeSearch = document.createElement('a');
          youtubeSearch.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(`${query} Haïti`)}`;
          youtubeSearch.target = '_blank';
          youtubeSearch.rel = 'noopener noreferrer';
          youtubeSearch.textContent = 'Chèche videyo sa a sou YouTube';
          searchResults.append(youtubeSearch);
        }
        return;
      }

      for (const item of data) {
        if (category === 'videos' && /^[A-Za-z0-9_-]{11}$/.test(item.video_id || '')) {
          const videoResult = document.createElement('article');
          const player = document.createElement('iframe');
          const videoTitle = document.createElement('h2');
          const videoLink = document.createElement('a');
          const videoDescription = document.createElement('p');
          const source = createSiteSource(item.lien);
          videoResult.className = 'video-result';
          player.src = `https://www.youtube-nocookie.com/embed/${item.video_id}`;
          player.title = item.titre || 'Videyo sou Haïti';
          player.loading = 'lazy';
          player.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
          player.allowFullscreen = true;
          videoLink.href = item.lien;
          videoLink.target = '_blank';
          videoLink.rel = 'noopener noreferrer';
          videoLink.textContent = item.titre || 'Gade videyo a sou YouTube';
          videoTitle.append(videoLink);
          videoDescription.className = 'result-description';
          videoDescription.textContent = item.description;
          videoResult.append(source, player, videoTitle, videoDescription);
          searchResults.append(videoResult);
          continue;
        }

        if (category === 'images' && item.image) {
          const imageResult = document.createElement('article');
          const imageLink = document.createElement('a');
          const image = document.createElement('img');
          const caption = document.createElement('p');
          const source = createSiteSource(item.lien);
          imageResult.className = 'image-result';
          imageLink.href = item.lien;
          imageLink.target = '_blank';
          imageLink.rel = 'noopener noreferrer';
          image.alt = item.titre || 'Imaj ki gen rapò ak rechèch la';
          image.src = item.image;
          image.loading = 'lazy';
          caption.textContent = item.titre || item.description || '';
          imageLink.append(image);
          imageResult.append(imageLink, caption, source);
          searchResults.append(imageResult);
          continue;
        }

        const result = document.createElement('article');
        const source = createSiteSource(item.lien);
        const title = document.createElement('h2');
        const link = document.createElement('a');
        const description = document.createElement('p');

        link.href = item.lien;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = item.titre;
        result.className = 'result-item';
        title.className = 'result-title';
        description.textContent = item.description;
        description.className = 'result-description';

        title.append(link);
        result.append(source, title, description);
        searchResults.append(result);
      }
    } catch (error) {
      if (error.name === 'AbortError') return;
      searchResults.replaceChildren();
      const errorMessage = document.createElement('p');
      errorMessage.className = 'results-state';
      errorMessage.textContent = error.message;
      searchResults.append(errorMessage);
    }
  }

  mapsCategory.href = `https://www.google.com/maps/search/${encodeURIComponent(`${searchInput.value.trim()} Haïti`)}`;
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.trim();
    mapsCategory.href = `https://www.google.com/maps/search/${encodeURIComponent(query ? `${query} Haïti` : 'Haïti')}`;
  });

  searchForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const query = searchInput.value.trim();
    if (!query) {
      searchResults.textContent = 'Ekri sa w ap chèche a.';
      return;
    }
    runSearch(query, activeCategory);
  });

  searchCategories.addEventListener('click', (event) => {
    const button = event.target.closest('[data-category]');
    if (!button) return;
    const query = searchInput.value.trim();
    if (!query) return;
    activeCategory = button.dataset.category;
    runSearch(query, activeCategory);
  });
</script>
</body>

</html>
